# For people working on the code. The installer does not use this file:
# it copies app/posetally into place and installs the packages itself.

[project]
name = "posetally"
version = "0.1.0"
description = "Score animal tracking from DeepLabCut with lines and regions"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "openpyxl>=3.1",
    "pyyaml",
    "numpy",
    "pandas>=2.2,<3",
    "tables>3.8",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
tracking = ["deeplabcut==3.0.2"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["app"]
